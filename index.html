<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal APPS DIRGF</title>
<meta name="description" content="Portal de aplicativos da Diretoria de Gente, Gestão, Finanças e Compras - Fundação INOVA">
<meta name="theme-color" content="#132c73">

<link rel="icon" href="img/icone_inova.png" type="image/png">
<link rel="apple-touch-icon" href="img/icone_inova.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<!-- Sidebar REDUZIDA: só aparece quando um painel/app está aberto -->
<aside class="sidebar-reduzida" id="sidebarReduzida">
    <div class="logo-mini">
        <img src="img/icone_inova.png" alt="Fundação INOVA">
    </div>
    <nav class="menu-reduzido" id="menuReduzidoContainer" aria-label="Menu de aplicativos">
        <!-- Gerado automaticamente pelo app.js -->
    </nav>
</aside>

<main class="content">

    <header class="header">

        <div class="header-left">
            <div class="header-title" id="headerTitulo"></div>
        </div>

        <div class="header-busca">
            <i class="bi bi-search"></i>
            <input type="search" id="campoBusca" placeholder="Buscar aplicativo..." aria-label="Buscar aplicativo">
        </div>

        <div class="user-area">

            <button class="btn-tema" onclick="Portal.alternarTema()" title="Alternar tema claro/escuro" aria-label="Alternar tema">
                <i class="bi bi-moon-fill" id="iconeTema"></i>
            </button>

            <button class="logout" onclick="Portal.logout()">
                <i class="bi bi-box-arrow-right"></i>
                Sair
            </button>

        </div>

    </header>

    <!-- ===================== HOME: cards grandes + favoritos + busca ===================== -->
    <section id="home">

        <h1 class="titulo-home">
             Portal de Aplicativos - DIRGF
        </h1>

        <p class="subtitulo-home">
            Selecione um painel para iniciar a navegação.
        </p>

        <div id="favoritosWrapper" class="favoritos-wrapper" style="display:none;">
            <h2 class="secao-titulo"><i class="bi bi-star-fill"></i> Favoritos</h2>
            <div id="favoritosBar" class="favoritos-bar"></div>
        </div>

        <h2 class="secao-titulo"><i class="bi bi-grid-3x3-gap-fill"></i> Todos os aplicativos</h2>
        <div id="cardsContainer" class="cards">
            <!-- Gerado automaticamente pelo app.js -->
        </div>

        <footer class="rodape-portal">
            <span id="versaoRodape"></span>
        </footer>

    </section>

    <!-- ===================== VISUALIZAÇÃO: frame central (aberto ao clicar em qualquer app) ===================== -->
    <section id="viewer">

        <div class="viewer-toolbar">
            <div class="viewer-toolbar-titulo">
                <i class="bi bi-display"></i>
                <span id="viewerTitulo"></span>
            </div>
            <div class="viewer-toolbar-acoes">
                <button class="btn-toolbar" onclick="Portal.abrirEmNovaAba()" title="Abrir em nova aba">
                    <i class="bi bi-box-arrow-up-right"></i> <span>Nova aba</span>
                </button>
                <button class="btn-toolbar btn-toolbar-fechar" onclick="Portal.voltarPortal()" title="Fechar e voltar para a Home">
                    <i class="bi bi-x-lg"></i> <span>Fechar</span>
                </button>
            </div>
        </div>

        <div class="viewer-frame-area">
            <div id="iframeStatus" class="iframe-overlay"></div>
            <div id="iframeErro" class="iframe-overlay iframe-erro"></div>
            <div id="linkPlaceholder" class="iframe-overlay link-placeholder"></div>

            <iframe
                id="painelFrame"
                title="Painel"
                loading="lazy">
            </iframe>
        </div>

    </section>

</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
